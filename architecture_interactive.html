<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 AI Agent Squad – Interactive Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <style>
    :root{
      --bg: #0f172a;
      --card: #111827;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --glass: rgba(255,255,255,.06);
      --ring: rgba(96,165,250,.45);
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:'Inter',system-ui,sans-serif; background:radial-gradient(1200px 800px at 10% 0%, #0b1220, var(--bg)); color:#e5e7eb;}
    header{position:sticky; top:0; z-index:50; backdrop-filter:blur(10px); background:linear-gradient(180deg,rgba(17,24,39,.9),rgba(17,24,39,.65)); border-bottom:1px solid rgba(255,255,255,.06);}
    .wrap{max-width:1200px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:36px;height:36px}
    .brand h1{font-size:18px;margin:0;font-weight:800;}
    nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .tab{border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;background:var(--glass);color:#e5e7eb;font-weight:600;cursor:pointer;}
    .tab.active{background:linear-gradient(135deg,var(--accent),#7c3aed);border-color:transparent}
    .grid{max-width:1200px;margin:24px auto;display:grid;grid-template-columns:280px 1fr;gap:18px;padding:0 16px}
    .side{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;height:calc(100vh - 120px);overflow:auto}
    .stage{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;position:relative;min-height:540px;overflow:auto}
    .stage h2{margin:8px 0;font-size:22px}
    .desc{color:var(--muted);margin-bottom:14px}
    #diagram{background:#0b1020;border-radius:12px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
    .zoom{position:absolute;top:16px;right:16px;display:flex;gap:8px}
    .zbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:var(--glass);color:#fff;font-weight:800;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;text-align:center}
    .card img{width:36px;height:36px;margin-bottom:8px;}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="https://streamlit.io/images/brand/streamlit-mark-color.png" alt="logo"/>
        <h1>AI Agent Squad — Interactive Architecture</h1>
      </div>
      <nav id="topTabs"></nav>
    </div>
  </header>
  <main class="grid">
    <aside class="side">
      <h3>Flows</h3>
      <div id="sideMenu"></div>
      <div class="cards" id="legend"></div>
    </aside>
    <section class="stage">
      <div class="zoom">
        <button class="zbtn" id="zin">+</button>
        <button class="zbtn" id="zout">−</button>
        <button class="zbtn" id="zreset">⟳</button>
      </div>
      <h2 id="title">Loading…</h2>
      <p id="desc" class="desc"></p>
      <div id="diagram" class="mermaid">graph LR; A[Loading]-->B[Please wait]</div>
    </section>
  </main>
  <script>
    mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose'});

    async function renderMermaid(code){
      const container = document.getElementById('diagram');
      container.textContent = 'Rendering…';
      try{
        const { svg } = await mermaid.render('mmd-'+Math.random().toString(36).slice(2), code.trim());
        container.innerHTML = svg;
      }catch(err){
        const safe = code.replace(/</g,'&lt;');
        container.innerHTML = `<pre style="white-space:pre-wrap;color:#fca5a5;background:rgba(239,68,68,.1);padding:12px;border-radius:8px;">Mermaid render error:
${err?.message||err}

Source:
${safe}</pre>`;
      }
      applyZoom();
    }

    const sections={
      overview:{
        title:'🏗️ Unified System Overview',
        desc:'How developers, CI/CD tools and our AI Agent Squad collaborate.',
        flows:[{id:'unified',name:'Unified Flow'}],
        diagram:`graph TD; Dev[👨‍💻 Developer]-->GL[🦊 GitLab]; GL-->|Build fails|WH[📡 Webhook]; WH-->SUP[🎯 Supervisor]; SUP-->PA[🔧 Pipeline Agent]; SUP-->QA[🔍 Quality Agent]; SUP-->RH[🔄 Retry]; PA-->PG[(Postgres)]; QA-->VDB[(Qdrant)]; RH-->UI[🖥️ UI];`
      }
    };

    function selectSection(key){
      const s=sections[key];
      document.getElementById('title').textContent=s.title;
      document.getElementById('desc').textContent=s.desc;
      renderMermaid(s.diagram);
    }

    window.addEventListener('DOMContentLoaded',()=>{
      selectSection('overview');
    });
  </script>
</body>
</html>
